services:
  web:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--limit-concurrency", "64", "--timeout-keep-alive", "5"]
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUTOMATION_DB_PATH: /app/data/automation.db
      AUTOMATION_OUTPUT_DIR: /app/data/outputs
      AUTOMATION_QUEUE_DIR: /app/data/queue
      FLOWDESK_TRUSTED_CLIENT_CIDRS: 172.30.0.1/32
      FLOWDESK_REMOTE_ACCESS_TOKEN: ${FLOWDESK_REMOTE_ACCESS_TOKEN:-}
      FLOWDESK_TRUSTED_PROXY_CIDRS: ${FLOWDESK_TRUSTED_PROXY_CIDRS:-}
      FLOWDESK_ALLOWED_HOSTS: ${FLOWDESK_ALLOWED_HOSTS:-}
      FLOWDESK_SMTP_USERNAME: ${FLOWDESK_SMTP_USERNAME:-}
      FLOWDESK_SMTP_PASSWORD: ${FLOWDESK_SMTP_PASSWORD:-}
      FLOWDESK_SMTP_ALLOWED_HOSTS: ${FLOWDESK_SMTP_ALLOWED_HOSTS:-}
      FLOWDESK_API_CREDENTIALS_JSON: ${FLOWDESK_API_CREDENTIALS_JSON:-}
    volumes:
      - flowdesk-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 768m
    cpus: 1.5
    networks: [flowdesk]

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      AUTOMATION_DB_PATH: /app/data/automation.db
      AUTOMATION_OUTPUT_DIR: /app/data/outputs
      AUTOMATION_QUEUE_DIR: /app/data/queue
      FLOWDESK_SMTP_USERNAME: ${FLOWDESK_SMTP_USERNAME:-}
      FLOWDESK_SMTP_PASSWORD: ${FLOWDESK_SMTP_PASSWORD:-}
      FLOWDESK_SMTP_ALLOWED_HOSTS: ${FLOWDESK_SMTP_ALLOWED_HOSTS:-}
      FLOWDESK_API_CREDENTIALS_JSON: ${FLOWDESK_API_CREDENTIALS_JSON:-}
    volumes:
      - flowdesk-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sqlite3; from datetime import datetime,timezone; c=sqlite3.connect(os.environ['AUTOMATION_DB_PATH']); r=c.execute(\"SELECT lease_until FROM scheduler_leases WHERE lease_name='schedule-dispatcher'\").fetchone(); assert r and datetime.fromisoformat(r[0]) > datetime.now(timezone.utc)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 1g
    cpus: 2.0
    networks: [flowdesk]

volumes:
  flowdesk-data:

networks:
  flowdesk:
    ipam:
      config:
        - subnet: 172.30.0.0/24
